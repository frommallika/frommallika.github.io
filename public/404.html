<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting | From Mallika</title>
    <script>
      (function () {
        var target = window.location.origin + '/#' + window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to From Mallika...</p>
  </body>
</html>
